####### this is as like as template, we need to add annotations later 
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-check
spec:
  template:
    spec:
      containers:
        - name: health-check
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              if curl -s http://172.17.0.232:8065 | grep -qi 'mattermost'; then
                echo 'Mattermost is up and Running'
                exit 0
              else
                echo 'Mattermost is NOT accessible'
                exit 1
              fi
      restartPolicy: Never
  backoffLimit: 0






